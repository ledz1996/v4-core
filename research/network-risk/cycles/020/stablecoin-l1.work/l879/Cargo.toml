[package]
name = "l879"
version = "0.1.0"
edition = "2021"
[dependencies]
ruint = { path = "../ruint/ruint-1.21.1", default-features = false }
ruint_fb = { path = "../ruint/ruint-fb", default-features = false }
ruint_old = { path = "../ruint/ruint-1.21.0", default-features = false }
num-bigint = "0.4"
num-traits = "0.2"
num-integer = "0.1"
[profile.release]
opt-level = 3
debug-assertions = false
overflow-checks = false
